<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: white;
            margin: 10px auto;
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            box-shadow: 0 0 5px gray;
        }
    </style>
</head>
<body>

<h1>My To-Do List</h1>
<ul id="taskList"></ul>

<script>
fetch('http://localhost:3000/tasks')
.then(res => res.json())
.then(data => {
    const list = document.getElementById('taskList');
    data.forEach(task => {
        const li = document.createElement('li');
        li.innerText = task.title + (task.completed ? " ✅" : "");
        list.appendChild(li);
    });
});
</script>

</body>
</html>
