<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</head>

<body>

<h2 id="heading">Student Registration Form</h2>

<form id="regForm">

    <label>Username</label>
    <input type="text" id="username" class="input-field"><br>

    <label>Email</label>
    <input type="text" id="email" class="input-field"><br>

    <label>Phone Number</label>
    <input type="text" id="phone" class="input-field"><br>

    <label>Password</label>
    <input type="password" id="password" class="input-field"><br>

    <label>Confirm Password</label>
    <input type="password" id="cpassword" class="input-field"><br>

    <button type="button" id="submitBtn" onclick="validateForm()">Register</button>
</form>

<p id="msg"></p>

<hr>

<img id="img1" src="img1.jpg" width="150">
<br><br>
<button onclick="changeImage()">Change Image</button>

<br><br>
<button id="jqBtn">jQuery Button</button>

</body>
</html>
